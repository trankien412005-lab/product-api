name: product-api-ci

services:
  mongodb:
    image: mongo:8.0
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-api:ci
    init: true
    environment:
      NODE_ENV: test
      PORT: "3000"
      MONGODB_URI: mongodb://mongodb:27017/productdb_ci
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s