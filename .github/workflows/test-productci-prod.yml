name: Product API - CRUD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    name: Docker healthcheck and CRUD tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run basic Product tests
        run: npm test

      - name: Validate CI Compose configuration
        run: docker compose -f docker-compose-ci.yaml config --quiet

      - name: Build and wait for healthy services
        run: >
          docker compose -f docker-compose-ci.yaml
          up -d --build --wait --wait-timeout 180

      - name: Show container status
        run: docker compose -f docker-compose-ci.yaml ps

      - name: Run real CRUD tests
        env:
          API_BASE_URL: http://127.0.0.1:3002
        run: npm run test:integration
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tested image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/product-api"

          docker tag product-api:ci "$IMAGE:sha-$GITHUB_SHA"
          docker tag product-api:ci "$IMAGE:latest"

          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"    

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose-ci.yaml ps -a
          docker compose -f docker-compose-ci.yaml logs --no-color --tail 200

      - name: Clean up CI containers
        if: always()
        run: docker compose -f docker-compose-ci.yaml down -v
  deploy-local:
    name: Deploy to local Docker Engine
    needs: integration-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, product-api-local]
    timeout-minutes: 10

    concurrency:
      group: product-api-local-deploy
      cancel-in-progress: false

    defaults:
      run:
        shell: powershell

    env:
      IMAGE_TAG: sha-${{ github.sha }}
      DOCKER_CONTEXT: desktop-linux

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Docker environment
        run: |
          $ErrorActionPreference = "Stop"

          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Khong ket noi duoc Docker Desktop"
          }

          docker volume inspect nammongodb-data
          if ($LASTEXITCODE -ne 0) {
            throw "Khong tim thay volume nammongodb-data"
          }

          @(
            "PORT=3000"
            "MONGODB_URI=mongodb://nammongodb:27017/productdb"
          ) | Set-Content -Path .env.docker -Encoding ascii

          docker compose -p product-api -f docker-compose-prod.yaml config --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Cau hinh Compose khong hop le"
          }

      - name: Pull tested image from Docker Hub
        run: |
          docker compose -p product-api -f docker-compose-prod.yaml pull api
          if ($LASTEXITCODE -ne 0) {
            throw "Khong tai duoc image tu Docker Hub"
          }

      - name: Deploy and wait for healthy containers
        run: |
          docker compose -p product-api -f docker-compose-prod.yaml up -d --no-build --wait --wait-timeout 180
          if ($LASTEXITCODE -ne 0) {
            throw "Trien khai that bai hoac container chua healthy"
          }

      - name: Verify deployed image and API health
        run: |
          $ErrorActionPreference = "Stop"

          $expectedImage = "kinkin2005/product-api:$env:IMAGE_TAG"
          $actualImage = docker inspect --format '{{.Config.Image}}' product-api-container
          if ($LASTEXITCODE -ne 0) {
            throw "Khong kiem tra duoc container API"
          }

          if ($actualImage.Trim() -ne $expectedImage) {
            throw "Container dang chay sai image: $actualImage"
          }

          $health = Invoke-RestMethod -Uri "http://127.0.0.1:3001/health" -TimeoutSec 10
          $health | ConvertTo-Json

          if ($health.status -ne "healthy" -or $health.database -ne "connected") {
            throw "API hoac MongoDB chua san sang"
          }

          docker compose -p product-api -f docker-compose-prod.yaml ps
          if ($LASTEXITCODE -ne 0) {
            throw "Khong doc duoc trang thai container"
          }

          Write-Host "Trien khai thanh cong: $expectedImage"

      - name: Show deployment logs on failure
        if: failure()
        run: |
          docker compose -p product-api -f docker-compose-prod.yaml ps -a
          docker compose -p product-api -f docker-compose-prod.yaml logs --no-color --tail 100        